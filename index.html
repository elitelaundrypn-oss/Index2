*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#021638}
body{font-family:"Elite Sans","DM Sans","Segoe UI",Roboto,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background-color:#04245F;
  background-image:radial-gradient(ellipse at 100% 0%,rgba(31,203,249,.18) 0%,rgba(31,203,249,0) 55%),
                   radial-gradient(ellipse at 0% 100%,rgba(9,121,204,.30) 0%,rgba(9,121,204,0) 55%),
                   linear-gradient(160deg,#06306f 0%,#04245F 48%,#021a48 100%)}
.a{position:absolute}
.card{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);border-radius:22px}
.lbl{font-size:16px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:#84D9F7;white-space:nowrap}

/* ---------- fundo animado ---------- */
#bg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.bub{position:absolute;bottom:-80px;border-radius:50%;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.035)}
.anim .bub{-webkit-animation:rise linear infinite;animation:rise linear infinite}
@-webkit-keyframes rise{0%{-webkit-transform:translateY(0)}100%{-webkit-transform:translateY(-1240px)}}
@keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-1240px)}}
.wave{position:absolute;left:0;width:3840px}
.anim .wave.w1{-webkit-animation:drift 46s linear infinite;animation:drift 46s linear infinite}
.anim .wave.w2{-webkit-animation:drift 70s linear infinite reverse;animation:drift 70s linear infinite reverse}
@-webkit-keyframes drift{from{-webkit-transform:translateX(0)}to{-webkit-transform:translateX(-1920px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1920px)}}

/* ---------- cabeçalho ---------- */
#hd{left:28px;top:24px;width:1864px;height:112px;display:flex;align-items:center;justify-content:space-between}
#br{display:flex;align-items:center}
#br .lg{position:relative;width:104px;height:104px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-right:20px;flex:none}
#br .lg img{width:84px;display:block}
.anim #br .lg{-webkit-animation:float 6s ease-in-out infinite;animation:float 6s ease-in-out infinite}
#br .spark{position:absolute;left:68px;top:4px;width:24px;height:24px;opacity:0}
.anim #br .spark{-webkit-animation:twinkle 3.6s ease-in-out infinite;animation:twinkle 3.6s ease-in-out infinite}
#br .spark svg{width:100%;height:100%;display:block}
#br .n{font-size:46px;font-weight:800;line-height:1;white-space:nowrap}
#br .n span{color:#1FCBF9}
#br .s{font-size:18px;font-weight:700;letter-spacing:2.5px;color:#9fbde6;margin-top:8px;text-transform:uppercase;white-space:nowrap}
@-webkit-keyframes float{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-4px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@-webkit-keyframes twinkle{0%,100%{opacity:0;-webkit-transform:scale(.3) rotate(0)}40%{opacity:1;-webkit-transform:scale(1.1) rotate(45deg)}70%{opacity:0;-webkit-transform:scale(.4) rotate(90deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1.1) rotate(45deg)}70%{opacity:0;transform:scale(.4) rotate(90deg)}}
#mid{display:flex;align-items:center}
.pill{display:flex;align-items:center;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);margin-left:14px;font-size:22px;font-weight:700;white-space:nowrap}
.pill b{color:#F5B018;margin-right:10px;font-size:16px;letter-spacing:2px}
.pill i{font-style:normal;font-size:16px;margin-left:8px}
.up{color:#5BE38A}.down{color:#FF7A6B}
#ck{text-align:right}
#time{font-size:84px;font-weight:800;line-height:.9;letter-spacing:-1px;white-space:nowrap}
#time .d{display:inline-block;width:.6em;text-align:center}
#time .c{display:inline-block;width:.3em;text-align:center;position:relative;top:-.08em;-webkit-transition:opacity .4s;transition:opacity .4s}
#date{font-size:22px;color:#DCE9FF;margin-top:6px;white-space:nowrap}

/* ---------- telão de notícias ---------- */
#nw{left:28px;top:156px;width:1264px;height:711px;border-radius:24px;overflow:hidden;background:#021437}
.sl{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;-webkit-transition:opacity 1.2s;transition:opacity 1.2s}
.sl.on{opacity:1}
.sl .bgimg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.anim .sl.on .bgimg{-webkit-animation:zoom 14s ease-out forwards;animation:zoom 14s ease-out forwards}
@-webkit-keyframes zoom{from{-webkit-transform:scale(1)}to{-webkit-transform:scale(1.07)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
.sl .noimg{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at 80% 20%,#0b4a9c 0%,#04245F 55%,#021437 100%)}
.sl .sh{position:absolute;left:0;right:0;bottom:0;height:78%;background:linear-gradient(to top,rgba(2,20,55,.97) 0%,rgba(2,20,55,.8) 40%,rgba(2,20,55,0) 100%)}
.sl .tx{position:absolute;left:52px;right:52px;bottom:48px}
.sl .tg{display:inline-block;background:#1FCBF9;color:#04245F;font-size:17px;font-weight:800;letter-spacing:2.5px;padding:6px 14px 5px;border-radius:8px}
.sl .tg.rn{background:#F5B018}
.sl h2{font-size:52px;font-weight:800;line-height:1.1;margin-top:16px;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.sl p{font-size:25px;color:#DCE9FF;line-height:1.35;margin-top:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sl small{display:block;font-size:19px;font-weight:700;color:#84D9F7;margin-top:14px}
.anim .sl.on .tx{-webkit-animation:up .9s ease-out both;animation:up .9s ease-out both}
@-webkit-keyframes up{from{opacity:0;-webkit-transform:translateY(24px)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.sl.brand .ctr{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 140px}
.sl.brand .badge{width:200px;height:200px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.sl.brand .badge img{width:150px}
.sl.brand h2{margin-top:34px;font-size:54px}
#nwtag{left:28px;top:26px;z-index:3;display:flex;align-items:center;background:rgba(2,20,55,.78);padding:10px 18px;border-radius:999px;font-size:17px;font-weight:800;letter-spacing:2px}
#nwtag:before{content:"";width:12px;height:12px;border-radius:50%;background:#F5B018;margin-right:10px}
#nwcnt{right:28px;top:26px;z-index:3;background:rgba(2,20,55,.78);padding:10px 18px;border-radius:999px;font-size:17px;font-weight:700}
#nwbar{left:0;bottom:0;height:6px;width:0;background:#F5B018;z-index:3}
#hint{left:50%;top:84px;z-index:4;display:flex;align-items:center;white-space:nowrap;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  padding:14px 30px 14px 20px;border-radius:999px;background:rgba(2,22,56,.92);border:2px solid #F5B018;font-size:27px;font-weight:700}
#hint svg{width:40px;height:40px;margin-right:14px}
#hint.hide{display:none}

/* ---------- coluna direita ---------- */
#wx{left:1316px;top:156px;width:576px;height:452px;padding:24px 28px}
#wx .hdr{display:flex;justify-content:space-between;align-items:baseline}
#wupd{font-size:15px;color:#8fb0dc}
.now{display:flex;align-items:center;margin-top:12px}
.now .wi{width:112px;height:112px;flex:none;margin-left:-6px}
.now .wi svg{width:112px;height:112px;display:block}
#wtemp{font-size:96px;font-weight:800;letter-spacing:-3px;line-height:1;margin-left:10px}
.now .ds{margin-left:20px;min-width:0}
#wdesc{display:block;font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wfeel{display:block;font-size:19px;color:#C9DCF5;margin-top:4px}
.st{display:flex;margin-top:14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
.st div{flex:1;text-align:center}
.st small{display:block;font-size:13px;font-weight:700;letter-spacing:1.4px;color:#8fb0dc;text-transform:uppercase}
.st strong{font-size:25px;white-space:nowrap}
.st strong small{display:inline;font-size:15px;letter-spacing:0;text-transform:none;color:#C9DCF5;font-weight:500}
#wfc{display:flex;margin-top:16px}
#wfc .day{flex:1;text-align:center;background:rgba(255,255,255,.055);border-radius:14px;margin-right:10px;padding:10px 0}
#wfc .day:last-child{margin-right:0}
#wfc .dn{font-size:17px;font-weight:700;color:#DCE9FF}
#wfc .wi{width:54px;height:54px;margin:3px auto}
#wfc .wi svg{width:54px;height:54px;display:block}
#wfc .mm{font-size:20px;font-weight:700;white-space:nowrap}
#wfc .mm span{color:#8fb0dc;font-weight:500;margin-left:4px}
#woff{text-align:center;font-size:24px;color:#C9DCF5;margin-top:80px;line-height:1.4}
#pr{left:1316px;top:624px;width:576px;height:110px;padding:18px 28px}
.pg{display:flex;margin-top:8px}
.pg div{flex:1}
.pg small{display:block;font-size:14px;font-weight:700;letter-spacing:1.4px;color:#8fb0dc;text-transform:uppercase}
.pg strong{display:block;font-size:26px;margin-top:2px;white-space:nowrap}
#rd{left:1316px;top:750px;width:576px;height:117px;padding:18px 28px;display:flex;align-items:center}
#rd .cv{width:80px;height:80px;border-radius:18px;background:linear-gradient(135deg,#F5B018,#e07b12);display:flex;align-items:center;justify-content:center;margin-right:22px;flex:none}
#bgv{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;background:#04245F;z-index:0;display:block}
#stage{z-index:1}
#stage.hasvid{background:transparent !important}
#stage.hasvid #bg{display:none}
#rd .eq{display:flex;align-items:flex-end;height:40px}
#rd .eq i{display:block;width:8px;height:12px;background:#04245F;margin:0 3px;border-radius:3px}
#rd.on .eq i{-webkit-animation:eq 1s ease-in-out infinite alternate;animation:eq 1s ease-in-out infinite alternate}
#rd.on .eq i:nth-child(2){-webkit-animation-delay:-.4s;animation-delay:-.4s}
#rd.on .eq i:nth-child(3){-webkit-animation-delay:-.7s;animation-delay:-.7s}
#rd.on .eq i:nth-child(4){-webkit-animation-delay:-.2s;animation-delay:-.2s}
@-webkit-keyframes eq{from{height:8px}to{height:38px}}
@keyframes eq{from{height:8px}to{height:38px}}
#rdname{display:block;font-size:26px;font-weight:800;margin-top:6px;white-space:nowrap}
#rdsub{display:block;font-size:19px;color:#C9DCF5;margin-top:4px;white-space:nowrap}

/* ---------- avisos ---------- */
#inf{left:28px;top:887px;width:1864px;height:94px;display:flex}
#inf .c{flex:1;min-width:0;margin-right:18px;display:flex;align-items:center;padding:0 22px}
#inf .c:last-child{margin-right:0}
#inf .ic{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#1FCBF9,#0867BB);display:flex;align-items:center;justify-content:center;margin-right:16px;flex:none}
#inf .ic.chat{background:linear-gradient(135deg,#3be07e,#12a14d)}
#inf .ic.estrela,#inf .ic.etiqueta{background:linear-gradient(135deg,#ffcf57,#F5B018)}
#inf .ic svg{width:30px;height:30px;display:block}
#inf h3{font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#inf p{font-size:17px;color:#C9DCF5;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-transition:opacity .5s;transition:opacity .5s}
#inf .t{min-width:0}

#diag{right:6px;top:986px;font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap}
/* ---------- faixa de notícias ---------- */
#tk{left:0;top:1000px;width:1920px;height:80px;background:#021638;display:flex}
#tk:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;z-index:4;background:linear-gradient(90deg,#F5B018 0%,#1FCBF9 30%,#0867BB 100%)}
#tklbl{flex:none;width:230px;background:#F5B018;color:#04245F;font-size:24px;font-weight:800;letter-spacing:3px;display:flex;align-items:center;justify-content:center;position:relative;z-index:3}
#tklbl:after{content:"";position:absolute;right:-24px;top:0;width:0;height:0;border-left:24px solid #F5B018;border-top:40px solid transparent;border-bottom:40px solid transparent}
#tview{flex:1;position:relative;overflow:hidden}
#tview:before{content:"";position:absolute;left:0;top:0;width:70px;height:100%;z-index:2;background:linear-gradient(90deg,#021638 30%,rgba(2,22,56,0) 100%)}
#track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap}
#track.run{-webkit-animation:tick linear infinite;animation:tick linear infinite}
@-webkit-keyframes tick{from{-webkit-transform:translateX(0)}to{-webkit-transform:translateX(-50%)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.copy{display:flex;align-items:center;flex:none;padding-left:56px}
.it{display:flex;align-items:center;flex:none;font-size:30px;font-weight:500;margin-right:30px}
.it .tg{flex:none;font-size:15px;font-weight:800;letter-spacing:2px;border:2px solid #1FCBF9;color:#1FCBF9;border-radius:8px;padding:4px 9px 3px;margin-right:16px;line-height:1.1}
.it .tg.rn{border-color:#F5B018;color:#F5B018}
.it .tg.loja{background:#F5B018;border-color:#F5B018;color:#04245F}
.it.loja{color:#FFE7A8}
.sep{flex:none;width:22px;height:22px;margin-right:30px}
.sep svg{width:22px;height:22px;display:block}
</style>
